<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile — Quantity Measurement</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">⚖️ QuantityMeasurement</div>
    <ul class="navbar-nav">
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="history.html" class="nav-link">History</a></li>
      <li><a href="profile.html" class="nav-link active">Profile</a></li>
      <li><button class="btn-logout" id="logoutBtn">Logout</button></li>
    </ul>
  </nav>

  <div class="page-container">
    <h1 class="page-title">My Profile</h1>
    <p class="page-subtitle">View and update your account details.</p>

    <div id="loadingSpinner" class="spinner"></div>

    <div class="profile-card" id="profileCard" style="display:none;">
      <div class="profile-avatar" id="avatarInitial">?</div>
      <div class="profile-name" id="profileName">—</div>
      <div class="profile-email" id="profileEmail">—</div>

      <div class="alert alert-error" id="alertError"></div>
      <div class="alert alert-success" id="alertSuccess"></div>

      <div class="form-group">
        <label for="newUsername">Update Username</label>
        <input type="text" id="newUsername" placeholder="New username" />
      </div>
      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input type="password" id="currentPassword" placeholder="Required to change password" />
      </div>
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Leave blank to keep current" />
      </div>

      <button class="btn-secondary" id="updateBtn">Update Profile</button>
      <button class="btn-danger" id="deleteBtn">Delete Account</button>
    </div>
  </div>

  <script src="../js/profile.js"></script>
</body>
</html>

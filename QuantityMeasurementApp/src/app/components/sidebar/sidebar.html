<aside class="sidebar" [class.collapsed]="!appState.sidebarOpen()">
  <nav class="sidebar-nav">
    <button class="sidebar-item" id="sidebar-dashboard"
            [class.active]="appState.activeView() === 'dashboard'"
            (click)="navigateTo('dashboard')">
      <span class="sidebar-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
      </span>
      <span class="sidebar-label">Dashboard</span>
    </button>

    <button class="sidebar-item" id="sidebar-history"
            [class.active]="appState.activeView() === 'history'"
            (click)="navigateTo('history')">
      <span class="sidebar-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="12 6 12 12 16 14"/>
        </svg>
      </span>
      <span class="sidebar-label">History</span>
      @if (!auth.isLoggedIn()) {
        <span class="lock-icon">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
          </svg>
        </span>
      }
    </button>
  </nav>

  <div class="sidebar-footer">
    <div class="sidebar-divider"></div>
    @if (auth.isLoggedIn()) {
      <div class="auth-status logged-in">
        <span class="status-dot"></span>
        <span class="sidebar-label">Signed In</span>
      </div>
    } @else {
      <div class="auth-status">
        <span class="sidebar-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </span>
        <span class="sidebar-label">Guest</span>
      </div>
    }
  </div>
</aside>
